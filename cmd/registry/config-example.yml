version: 0.1
log:
  fields:
    service: registry
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  tag:
    concurrencylimit: 8
# Per-repository usage ledger and quota enforcement. Disabled by default.
# accounting:
#   enabled: true
#   releaseonuntag: true
#   reservationttl: 24h
#   reconcile:
#     onstart: true
#     interval: 1h
#   budget:
#     default: 10GiB
#     repositories:
#       "library/*": 100GiB
http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
auth:
  htpasswd:
    realm: basic-realm
    path: /etc/registry
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
